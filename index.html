<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación Postulantes SAFRI</title>
<style>
:root{
  --primary:#7c3aed; --primary-dark:#5b21b6; --accent:#ec4899;
  --bg:#f8f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#f8f7fb,#f3e8ff);color:var(--text);
  min-height:100vh;line-height:1.5;padding:16px}
.wrap{max-width:760px;margin:0 auto}
.header{text-align:center;padding:20px 10px 28px}
.header h1{font-size:22px;color:var(--primary-dark);margin-bottom:6px}
.header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:26px;
  box-shadow:0 4px 24px rgba(124,58,237,.08);margin-bottom:18px}
h2{font-size:18px;color:var(--primary-dark);margin-bottom:14px}
h3{font-size:15px;color:var(--primary-dark);margin:16px 0 8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);
  border-radius:10px;font-size:14px;font-family:inherit;background:#fff;transition:.15s;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{display:inline-block;padding:13px 26px;border:none;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.15s;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost:hover{background:#f3e8ff}
.btn-full{width:100%}
.opt{display:block;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:10px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
.opt:hover{border-color:var(--primary);background:#faf5ff}
.opt.sel{border-color:var(--primary);background:#f3e8ff;font-weight:600}
.opt input{display:none}
.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.3s}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.good{background:#d1fae5;color:#065f46}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.bad{background:#fee2e2;color:#991b1b}
.chip.info{background:#e0e7ff;color:#3730a3}
.notice{background:#fef3c7;border-left:4px solid var(--warn);padding:12px 14px;
  border-radius:8px;font-size:13px;margin-bottom:16px;color:#78350f}
.notice.info{background:#e0e7ff;border-color:var(--primary);color:#3730a3}
.notice.danger{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.timer{font-size:34px;font-weight:700;color:var(--accent);text-align:center;margin:10px 0}
.timer.warn{color:var(--bad);animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.timer-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--bad));transition:width .3s linear}
.prod-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media(max-width:560px){.prod-list{grid-template-columns:1fr 1fr}}
.prod{background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:14px;font-size:13px;text-align:center}
.prod .emoji{font-size:34px;display:block;line-height:1.2;margin-bottom:4px}
.prod b{color:var(--primary-dark);font-size:15px}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.result-box{text-align:center;padding:26px;background:#f3e8ff;border-radius:14px;margin:14px 0}
.code-box{background:#1f2937;color:#a7f3d0;padding:14px;border-radius:10px;
  font-family:monospace;font-size:12px;word-break:break-all;max-height:180px;overflow:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f9fafb;font-weight:600;color:#374151;font-size:12px;text-transform:uppercase}
tr:hover td{background:#faf5ff}
.admin-link{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
.admin-link a{color:var(--muted);text-decoration:none;cursor:pointer}
.admin-link a:hover{color:var(--primary)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:4px}
.tag.p{background:#fee2e2;color:#991b1b}
.tag.n{background:#fef3c7;color:#92400e}
.tag.g{background:#d1fae5;color:#065f46}
.detail{background:#f9fafb;border-radius:10px;padding:14px;margin:10px 0;font-size:13px}
.detail h4{font-size:13px;color:var(--primary-dark);margin:10px 0 6px}
.detail .qa{margin-bottom:8px}
.detail .qa .q{font-weight:600;color:#374151}
.detail .qa .a{color:var(--muted)}
.psy-box{background:linear-gradient(135deg,#faf5ff,#fce7f3);border:2px solid var(--primary);
  border-radius:14px;padding:18px;margin:14px 0}
.psy-box h4{font-size:14px;color:var(--primary-dark);margin-bottom:8px;letter-spacing:.5px}
.psy-bar{height:22px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:6px 0 12px;position:relative}
.psy-bar > div{height:100%;border-radius:99px;transition:width .6s ease}
.psy-bar span{position:absolute;right:8px;top:2px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.4)}
.psy-dim{margin-bottom:10px}
.psy-dim label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#374151}
.psy-dim label b{color:var(--primary-dark)}
.psy-narrative{background:#fff;border-radius:10px;padding:14px;font-size:13px;line-height:1.7;color:#374151;margin-top:10px}
.psy-narrative b{color:var(--primary-dark)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🌟 Evaluación Postulantes SAFRI</h1>
    <p>Jesús María, Lima · Proceso de selección de personal</p>
  </div>
  <div id="app"></div>
  <div class="admin-link">
    <a onclick="pedirAdmin()">Acceso administrador</a>
  </div>
</div>

<script>
/* ============================================================

   ============================================================ */
const ADMIN_PASSWORD = 'Tienda2024*';
const TIEMPO_MINIMO_TEST = 180;
const TIEMPO_POR_CALCULO = 50;   // ⏱️ segundos POR CADA pregunta de cálculo

/* ============================================================
   DATOS BASE
   ============================================================ */
const DISTRITOS_LIMA = [
  "Ancón","Ate","Barranco","Breña","Carabayllo","Chaclacayo","Chorrillos","Cieneguilla",
  "Comas","El Agustino","Independencia","Jesús María","La Molina","La Victoria","Lima (Cercado)",
  "Lince","Los Olivos","Lurigancho-Chosica","Lurín","Magdalena del Mar","Miraflores","Pachacámac",
  "Pucusana","Pueblo Libre","Puente Piedra","Punta Hermosa","Punta Negra","Rímac","San Bartolo",
  "San Borja","San Isidro","San Juan de Lurigancho","San Juan de Miraflores","San Luis",
  "San Martín de Porres","San Miguel","Santa Anita","Santa María del Mar","Santa Rosa",

/* ============================================================
   SECCIÓN 1: PERSONALIDAD (6 preguntas)
   ============================================================ */
const PREGUNTAS_PERSONALIDAD = [
  { id:'p1', texto:'Cuando no hay clientes en la tienda, lo primero que haces es:',
    opciones:[
      {t:'Adelanto pendientes personales rápidos (responder mensajes, coordinar algo), así no dejo cosas para después.', p:-2},
      {t:'Acomodo la mercadería por color y talla, y reviso qué falta reponer.', p:3},
      {t:'Descanso un momento en la trastienda; así repongo energía para cuando lleguen clientes.', p:-1},

    ]},
  { id:'p2', texto:'Tu compañera llega tarde por tercera vez esta semana y te pide "no la quemes" porque son amigas. ¿Qué haces?',
    opciones:[
      {t:'Le digo que hable ella misma con la encargada; si no lo hace hoy, tendré que reportarlo.', p:3},

  { id:'p4', texto:'Sobre el uso del celular en horario de trabajo:',
    opciones:[
      {t:'Lo uso brevemente para coordinar temas personales urgentes; hoy todos lo hacemos.', p:-2},
      {t:'Lo mantengo guardado; solo lo reviso en mi refrigerio y en emergencias reales.', p:3},
      {t:'Lo tengo a la vista porque a veces lo uso para mostrar productos o tomar fotos.', p:2},
      {t:'Lo reviso en ratos libres cuando no hay público; es algo normal.', p:-2}
    ]},
  { id:'p5', texto:'Al cerrar el día, el sistema muestra S/ 30 de más respecto a lo que hay físicamente en caja. ¿Qué haces?',
    opciones:[
      {t:'Lo pongo como sobrante y lo reporto en el cierre del mes, para no hacer ajustes diarios.', p:-1},
      {t:'Lo reporto por escrito a la encargada en el momento y dejo constancia firmada.', p:3},
      {t:'Reviso las boletas del día para ver si fue un vuelto mal dado y aviso de inmediato.', p:2},
      {t:'Lo guardo en un sobre con una nota y lo comento al día siguiente.', p:0}
    ]},
  { id:'p6', texto:'¿Cómo reaccionas si te dicen que tu horario cambiará la próxima semana (mañana por tarde)?',
    opciones:[
      {t:'Me adapto, entiendo que la tienda lo necesita; luego coordino detalles con la encargada.', p:3},
      {t:'Aviso que no puedo, tengo otras responsabilidades asumidas para ese horario.', p:-1},
      {t:'Lo converso con mis compañeras primero para ver quién puede apoyar.', p:-1},
      {t:'Pregunto el motivo y coordino con la encargada cómo organizarnos.', p:3}
    ]}
];

/* ============================================================
   SECCIÓN 2: COMUNICACIÓN Y PERSUASIÓN (5 preguntas)
   ============================================================ */
const PREGUNTAS_COMUNICACION = [
  { id:'co1', texto:'Entra una clienta con cara de pocos amigos, sin mirar nada. ¿Cuál es tu primera reacción?',
    opciones:[
      {t:'La dejo tranquila; cuando quiera algo me llamará.', p:-1},
      {t:'Le sonrío y le digo algo ligero: "Bienvenida, pase sin compromiso, aquí todo se ve bonito hasta sin querer comprar".', p:3},
      {t:'Me acerco y le pregunto directamente qué busca, para no perder tiempo.', p:1},
      {t:'Le comento el clima o algo casual para romper el hielo antes de ofrecerle algo.', p:2}
    ]},
  { id:'co2', texto:'Un cliente varón entra a comprar un regalo para su esposa y no tiene idea qué elegir. Se le nota incómodo. ¿Qué haces?',
    opciones:[
      {t:'Le digo en broma: "Tranquilo, no es examen, solo es un regalo. La ayudamos a quedar como héroe".', p:3},
      {t:'Le pregunto por el estilo de su esposa y le muestro 2 o 3 opciones que combinen.', p:3},
      {t:'Le digo: "Cualquiera le va a gustar, todas son bonitas".', p:-1},
      {t:'Le sugiero el producto más vendido y le explico por qué es un acierto seguro.', p:2}
    ]},
  { id:'co3', texto:'Una clienta te dice: "Está muy caro, en la tienda de la esquina lo vi más barato". ¿Cuál es la mejor respuesta?',
    opciones:[
      {t:'"Puede ser, pero le aseguro que la calidad no es la misma; esto le va a durar el doble".', p:2},
      {t:'"Tiene razón, es un poco más, pero mire el detalle del cierre y el material; eso marca la diferencia".', p:3},
      {t:'"Si quiere le puedo hacer un descuentito, pero no se lo diga a nadie".', p:-2},
      {t:'"Bueno, si lo encuentra más barato, llévelo allá".', p:-3}
    ]},
  { id:'co4', texto:'Estás atendiendo a una clienta y entra otra apurada pidiendo algo rápido. ¿Qué haces?',
    opciones:[
      {t:'Le digo a la segunda: "Un momentito, en cuanto termine con ella la atiendo, no se me va".', p:3},
      {t:'Dejo a la primera y atiendo a la segunda, porque se ve más apurada.', p:-2},
      {t:'Les digo a las dos: "Ya las atiendo, por favor un momento", y trato de repartirme.', p:2},
      {t:'Le pido a la primera que espere un momento y atiendo rápido a la segunda.', p:0}
    ]},
  { id:'co5', texto:'¿Cómo describirías tu estilo al atender a un cliente nuevo?',
    opciones:[
      {t:'Amable pero directa: le muestro lo que necesita y cierro la venta rápido.', p:0},
      {t:'Cercana y conversadora: me gusta que se sienta cómoda, incluso me río con ellos si se da el momento.', p:3},
      {t:'Respetuosa y tranquila: dejo que ellos tomen la iniciativa.', p:-1},
      {t:'Con chispa y buena energía: una broma ligera siempre rompe el hielo.', p:2}
    ]}
];

/* ============================================================
   SECCIÓN 3: MEMORIA VISUAL (imágenes/emojis)
   ============================================================ */
const PRODUCTOS_MEMORIA = [
  {emoji:'👛', n:'Cartera roja',    p:89},
  {emoji:'💍', n:'Anillo dorado',   p:45},
  {emoji:'📿', n:'Collar de perlas',p:60},
  {emoji:'👜', n:'Cartera negra',   p:120},
  {emoji:'👂', n:'Aretes',          p:25},
  {emoji:'⌚', n:'Pulsera',         p:35}
];
const PREGUNTAS_MEMORIA = [
  {id:'m1', t:'¿Qué emoji tenía el precio más alto?', ops:['👛','💍','👜','📿'], ok:2},
  {id:'m2', t:'¿Cuánto costaba el 📿 collar de perlas?', ops:['S/ 45','S/ 60','S/ 35','S/ 89'], ok:1},
  {id:'m3', t:'¿Cuál de estos emojis NO apareció?', ops:['⌚','💍','👠','👂'], ok:2},
  {id:'m4', t:'¿Cuántos productos había en total?', ops:['4','5','6','7'], ok:2},
  {id:'m5', t:'¿Qué producto costaba S/ 25?', ops:['👂 Aretes','⌚ Pulsera','💍 Anillo','📿 Collar'], ok:0}
];

/* ============================================================
   SECCIÓN 4: CÁLCULO (4 preguntas · 50 s CADA UNA)
   ============================================================ */
const PREGUNTAS_CALCULO = [
  {id:'c1', t:'Un cliente compra: cartera S/ 89 + aretes S/ 25 + blusa S/ 45. Paga con S/ 200. ¿Cuál es el vuelto?',
    ops:['S/ 41','S/ 51','S/ 31','S/ 45'], ok:0},
  {id:'c2', t:'Aplica un 20% de descuento a un producto de S/ 150. ¿Cuál es el precio final?',
    ops:['S/ 130','S/ 135','S/ 120','S/ 125'], ok:2},
  {id:'c3', t:'Cuadre del día: ventas S/ 1250. En caja hay S/ 1180 + Yape/Plin S/ 45. ¿Falta o sobra y cuánto?',
    ops:['Sobra S/ 25','Falta S/ 25','Falta S/ 30','Está exacto'], ok:1},
  {id:'c4', t:'Un cliente paga S/ 100 por 2 artículos de S/ 35 cada uno. ¿Cuál es el vuelto?',
    ops:['S/ 25','S/ 30','S/ 35','S/ 20'], ok:1}
];

/* ============================================================
   SECCIÓN 5: PREGUNTAS ABIERTAS (2)
   ============================================================ */
const PREGUNTAS_ABIERTAS = [
  {id:'a1', t:'Cuéntanos brevemente tu último trabajo o, si nunca has trabajado, una situación donde asumiste una responsabilidad. Incluye la inicial del nombre de una persona involucrada y el mes aproximado.',
   maxPalabras:70},
  {id:'a2', t:'Si tuvieras que vender una cartera de S/ 120 a una clienta que dice "está muy caro", ¿qué le dirías? Escribe EXACTAMENTE las palabras que usarías, como si estuvieras hablando.',
   maxPalabras:60}
];

/* ============================================================
   UTILIDADES
   ============================================================ */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function render(html){$('app').innerHTML=html;}
function encodeRes(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function decodeRes(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim()))));}catch(e){return null;}}

let S = {
  registro:{}, respuestas:{personalidad:{},comunicacion:{},memoria:{},calculo:{},abiertas:{}},
  orden:{}, flags:{tab:0,paste:0,inicio:null,fin:null},
  timers:{calculoInterval:null,calculoRestante:0,tiemposCalculo:[]}
};

/* ============================================================
   REGISTRO
   ============================================================ */
function vRegistro(){
  const distritos = DISTRITOS_LIMA.map(d=>`<option value="${d}">${d}</option>`).join('');
  const grados = GRADOS.map(g=>`<option value="${g}">${g}</option>`).join('');
  render(`
  <div class="card">
    <h2>📋 Datos del postulante</h2>
    <div class="notice info">Completa tus datos y luego continúa con el test. El proceso tiene 4 etapas: test → entrevista → prueba en tienda (2 h) → aprobación y contrato.</div>
    <form id="fReg" onsubmit="return guardarRegistro(event)">
      <div class="field"><label>Nombre completo *</label>
        <input required name="nombre" placeholder="Ej. María Fernanda Quispe Rojas"></div>
      <div class="row">
        <div class="field"><label>Número de documento *</label>
          <input required name="dni" pattern="[0-9]{8,12}" title="Solo números (8 a 12 dígitos)" placeholder="Ej. 74581236"></div>
        <div class="field"><label>Edad *</label>
          <input required name="edad" type="number" min="16" max="70" placeholder="Ej. 22"></div>
      </div>
      <div class="row">
        <div class="field"><label>Correo electrónico *</label>
          <input required name="correo" type="email" placeholder="tucorreo@gmail.com"></div>
        <div class="field"><label>Número telefónico *</label>
          <input required name="telefono" pattern="[0-9+ ]{9,15}" placeholder="Ej. 987654321"></div>
      </div>
      <div class="field"><label>Grado de instrucción *</label>
        <select required name="grado"><option value="">-- Selecciona --</option>${grados}</select></div>
      <div class="field"><label>Distrito de residencia *</label>
        <select required name="distrito"><option value="">-- Selecciona --</option>${distritos}</select></div>
      <div class="row">
        <div class="field"><label>Modalidad *</label>
          <select required name="modalidad" onchange="actualizarTurno()">
            <option value="">-- Selecciona --</option>
            <option value="Full time">Full time</option>
            <option value="Part time">Part time</option>
          </select></div>
        <div class="field"><label>Permanencia mínima *</label>
          <select required name="permanencia">
            <option value="">-- Selecciona --</option>
            <option value="3 meses">3 meses</option>
            <option value="6 meses">6 meses</option>
            <option value="Más de un año">Más de un año</option>
          </select></div>
      </div>
      <div class="field"><label>Turno disponible *</label>
        <select required name="turno" id="selTurno">
          <option value="">-- Primero elige modalidad --</option>
        </select></div>
      <div class="row">
        <div class="field"><label>Disponibilidad inmediata *</label>
          <select required name="disponibilidad"><option value="">-- Selecciona --</option>
            <option value="Sí">Sí</option><option value="No">No</option></select></div>
        <div class="field"><label>Aspiración económica (S/) *</label>
          <input required name="sueldo" type="number" min="0" step="50" placeholder="Ej. 1200"></div>
      </div>
      <button class="btn btn-full" type="submit">Continuar al test →</button>
    </form>
  </div>`);
}

function actualizarTurno(){
  const m = document.querySelector('[name=modalidad]').value;
  const sel = $('selTurno');
  let op = '<option value="">-- Selecciona turno --</option>';
  if(m==='Full time'){
    op += '<option value="9:00 a 18:00 (1 h refrigerio)">9:00 a 18:00 (1 h refrigerio)</option>';
    op += '<option value="14:00 a 22:00">14:00 a 22:00</option>';
  } else if(m==='Part time'){
    op += '<option value="10:00 a 14:00">10:00 a 14:00</option>';
    op += '<option value="18:00 a 22:00">18:00 a 22:00</option>';
  }
  sel.innerHTML = op;
}

function guardarRegistro(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  S.registro = Object.fromEntries(fd);
  const edad = +S.registro.edad;
  if(edad < 18 && S.registro.modalidad==='Full time'){
    if(!confirm('Tienes menos de 18 años y elegiste Full time. ¿Deseas continuar?')) return false;
  }
  PREGUNTAS_PERSONALIDAD.forEach(q=>{ S.orden[q.id] = shuffle(q.opciones.map((o,i)=>({...o, orig:i}))); });
  PREGUNTAS_COMUNICACION.forEach(q=>{ S.orden[q.id] = shuffle(q.opciones.map((o,i)=>({...o, orig:i}))); });
  PREGUNTAS_MEMORIA.forEach(q=>{ S.orden[q.id] = shuffle(q.ops.map((o,i)=>({o, i}))); });
  PREGUNTAS_CALCULO.forEach(q=>{ S.orden[q.id] = shuffle(q.ops.map((o,i)=>({o, i}))); });
  S.flags.inicio = Date.now();
  vIntroTest();
  return false;
}

    $('btnCal').disabled = false;
  };

  iniciarTimerCalculoPregunta(i);

function iniciarTimerCalculoPregunta(indicePregunta){
  detenerTimerCalculo();
  S.timers.calculoRestante = TIEMPO_POR_CALCULO;
  const t0 = Date.now();
  S.timers.calculoInterval = setInterval(()=>{
    S.timers.calculoRestante--;
    const t = S.timers.calculoRestante;
    const el = $('tmrCalc'), bar = $('barCalc');
    if(el){ el.textContent = t; el.parentElement.style.color = t<=15 ? 'var(--bad)' : 'var(--accent)'; }
    if(bar){ bar.style.width = (Math.max(t,0)/TIEMPO_POR_CALCULO*100)+'%'; }
    if(t <= 0){
      detenerTimerCalculo();
      // Registrar tiempo usado para esta pregunta
      S.timers.tiemposCalculo[indicePregunta] = TIEMPO_POR_CALCULO;
      // Si no respondió, marcar como incorrecta
      const qid = PREGUNTAS_CALCULO[indicePregunta].id;
      if(!S.respuestas.calculo[qid]){
        S.respuestas.calculo[qid] = {txt:'(sin responder)', origIdx:-1, correcta:false};
      }
      // Pasar a la siguiente sin alert
      vCalculo(indicePregunta+1);
    }
  },1000);
  S.timers.calculoInicioPregunta = t0;
}

function siguienteCalculo(i){
  const qid = PREGUNTAS_CALCULO[i].id;
  const tiempoUsado = TIEMPO_POR_CALCULO - S.timers.calculoRestante;
  S.timers.tiemposCalculo[i] = tiempoUsado;
  detenerTimerCalculo();
  // Si no respondió (no debería pasar porque el botón está deshabilitado, pero por seguridad)
  if(!S.respuestas.calculo[qid]){
    S.respuestas.calculo[qid] = {txt:'(sin responder)', origIdx:-1, correcta:false};
  }
  vCalculo(i+1);
}

function detenerTimerCalculo(){
  if(S.timers.calculoInterval){ clearInterval(S.timers.calculoInterval); S.timers.calculoInterval = null; }
}

/* ============================================================
   FINALIZAR + AUDITORÍA PSICOMÉTRICA
   ============================================================ */
function finalizarTest(){
  detenerTimerCalculo();
  const tas = document.querySelectorAll('textarea[data-qid]');
  for(const t of tas){
    if(t.value.trim().length < 15){ alert('Por favor responde todas las preguntas abiertas con al menos una frase.'); t.focus(); return; }
    S.respuestas.abiertas[t.dataset.qid] = t.value.trim();
  }
  S.flags.fin = Date.now();
  S.flags.tiempoTotal = Math.round((S.flags.fin - S.flags.inicio)/1000);

  let pPers = 0, maxPers = 0;
  PREGUNTAS_PERSONALIDAD.forEach(q=>{ pPers += S.respuestas.personalidad[q.id]?.p ?? 0; maxPers += 3; });
  let pCom = 0, maxCom = 0;
  PREGUNTAS_COMUNICACION.forEach(q=>{ pCom += S.respuestas.comunicacion[q.id]?.p ?? 0; maxCom += 3; });
  let pMem = 0;
  Object.values(S.respuestas.memoria).forEach(m=>{ if(m.correcta) pMem++; });
  let pCal = 0;
  Object.values(S.respuestas.calculo).forEach(c=>{ if(c.correcta) pCal++; });
  const tiempoCalculoTotal = (S.timers.tiemposCalculo||[]).reduce((a,b)=>a+b,0);

  const flags = [];
  if(S.flags.tiempoTotal < TIEMPO_MINIMO_TEST) flags.push('Tiempo total muy bajo ('+S.flags.tiempoTotal+'s) — posible uso de IA o respuestas al azar.');
  if(S.flags.tab > 2) flags.push('Cambios de pestaña detectados ('+S.flags.tab+') — posible búsqueda externa.');
  if(S.flags.paste > 0) flags.push('Intento(s) de pegar texto ('+S.flags.paste+') — posible uso de IA.');
  if(S.registro.modalidad === 'Full time' && S.registro.permanencia === '3 meses')
    flags.push('Coherencia: eligió Full time pero permanencia de solo 3 meses.');

  // Auditoría psicométrica
  const psico = auditarPsicometricamente({
    pPers, maxPers, pCom, maxCom, pMem, pCal,
    tiemposCalculo: S.timers.tiemposCalculo, flags, S
  });

  const resultado = {
    ...S.registro,
    fecha: new Date().toISOString(),
    puntajes: {
      personalidad:pPers, maxPersonalidad:maxPers,
      comunicacion:pCom, maxComunicacion:maxCom,
      memoria:pMem, maxMemoria:PREGUNTAS_MEMORIA.length,
      calculo:pCal, maxCalculo:PREGUNTAS_CALCULO.length
    },
    tiempoCalculoTotal,
    tiemposCalculo: S.timers.tiemposCalculo,
    respuestas: S.respuestas,
    flags,
    flagCount: {tab:S.flags.tab, paste:S.flags.paste, tiempoTotal:S.flags.tiempoTotal},
    abiertas: S.respuestas.abiertas,
    psicometrico: psico
  };

  try{
    const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
    lista.push(resultado);
    localStorage.setItem('postulantes_jm', JSON.stringify(lista));
  }catch(e){}

  const code = encodeRes(resultado);
  render(`
  <div class="card">
    <h2>✅ Test finalizado</h2>
    <div class="result-box">
      <p>Tu test fue registrado correctamente.</p>
      <p style="margin-top:8px;font-size:13px">Copia el siguiente código y envíalo por WhatsApp al número del aviso.</p>
    </div>
    <h3>Código de postulación</h3>
    <div class="code-box" id="cod">${code}</div>
    <button class="btn btn-full" onclick="copiarCodigo()">📋 Copiar código</button>
    <br><br>
    <button class="btn btn-ghost btn-full" onclick="descargarJSON()">⬇️ Descargar como archivo</button>
    <div class="notice info" style="margin-top:16px">
      Si en los próximos días no recibes respuesta, puedes escribir al mismo WhatsApp. ¡Gracias por tu tiempo!
    </div>
  </div>`);
  window.__lastResult = resultado;
}

/* ============================================================
   AUDITORÍA PSICOMÉTRICA "IA"
   Analiza respuestas y genera un informe estructurado.
   ============================================================ */
function auditarPsicometricamente({pPers,maxPers,pCom,maxCom,pMem,pCal,tiemposCalculo,flags,S}){
  const resp = S.respuestas;
  const pctPers = maxPers? (pPers/maxPers)*100 : 0;
  const pctCom  = maxCom ? (pCom/maxCom)*100 : 0;
  const pctMem  = (pMem/PREGUNTAS_MEMORIA.length)*100;
  const pctCal  = (pCal/PREGUNTAS_CALCULO.length)*100;

  // Dimensiones psicométricas (0-100)
  // Extroversión: iniciativas de contacto, humor, proactividad al cliente
  let extro = pctCom*0.7 + pctPers*0.3;
  // Amabilidad/Empatía: escucha, colaboración, tacto
  let amab = pctCom*0.5 + pctPers*0.5;
  // Responsabilidad: caja, celular, reportes
  let respo = pctPers*0.6 + pctCal*0.4;
  // Estabilidad emocional: reacción a la corrección, presión, cambio de horario
  let estab = (resp.personalidad.p6?.p>=2?90:60) + (resp.personalidad.p2?.p>=2?90:60) + (resp.comunicacion.co4?.p>=2?90:60);
  estab = estab/3;
  // Apertura / Iniciativa: proactividad, aprendizaje, retos
  let apert = pctPers*0.6 + pctCom*0.4;
  // Resiliencia comercial: cierre de ventas, manejo de objeciones
  let resil = (resp.comunicacion.co3?.p>=2?90:50) + (resp.comunicacion.co5?.p>=2?90:55) + pctCom;
  resil = resil/3;

  // Ajustes finos por señales específicas
  if(resp.personalidad.p4?.p < 0) respo -= 15;   // uso celular
  if(resp.personalidad.p5?.p < 0) respo -= 20;   // reporte caja
  if(resp.personalidad.p2?.p >= 3) respo += 10; // reporta a compañera
  if(resp.comunicacion.co2?.p >= 3) extro += 10; // humor con cliente
  if(resp.comunicacion.co3?.p >= 3) resil += 10; // manejo de objeción
  if(resp.comunicacion.co1?.p >= 3) extro += 5;

  // Penalización por flags
  const penal = flags.length*5;

  extro = Math.max(0, Math.min(100, extro - penal*0.3));
  amab  = Math.max(0, Math.min(100, amab  - penal*0.3));
  respo = Math.max(0, Math.min(100, respo - penal*0.5));
  estab = Math.max(0, Math.min(100, estab - penal*0.3));
  apert = Math.max(0, Math.min(100, apert - penal*0.3));
  resil = Math.max(0, Math.min(100, resil - penal*0.4));

  const prom = (extro+amab+respo+estab+apert+resil)/6;

  // Perfil conductual
  let perfil, perfilColor;
  if(prom>=78 && flags.length===0){ perfil='PERFIL IDEAL — Vendedora estrella'; perfilColor='good'; }
  else if(prom>=65){ perfil='PERFIL PROMETEDOR — Requiere refuerzo en entrevista'; perfilColor='warn'; }
  else if(prom>=50){ perfil='PERFIL MODERADO — Evaluar con cuidado'; perfilColor='warn'; }
  else { perfil='PERFIL DE RIESGO — No recomendado para atención directa'; perfilColor='bad'; }

  // Riesgos detectados
  const riesgos = [];
  if(estab < 60) riesgos.push('Posible baja tolerancia a la corrección o al cambio de horario.');
  if(respo < 60) riesgos.push('Señales de descuido en caja o uso del celular en horario laboral.');
  if(extro < 60) riesgos.push('Tendencia a actitud pasiva con el cliente; dificultad para romper el hielo.');
  if(resil < 60) riesgos.push('Dificultad para manejar objeciones de precio o clientes indecisos.');
  if(amab < 60)  riesgos.push('Baja empatía percibida; podría no conectar con clientas mayores.');
  if(pctMem < 50) riesgos.push('Memoria visual por debajo del promedio; puede afectar exhibición y precios.');
  if(pctCal < 50) riesgos.push('Cálculo por debajo del estándar para manejo de caja.');
  if(flags.length) riesgos.push('Alertas de integridad: '+flags.join(' '));

  // Fortalezas
  const fortalezas = [];
  if(extro >= 75) fortalezas.push('Excelente facilidad para iniciar conversación y romper el hielo con humor.');
  if(amab  >= 75) fortalezas.push('Empatía marcada; genera confianza rápido en clientas de todo perfil.');
  if(respo >= 75) fortalezas.push('Alto sentido de responsabilidad, especialmente en manejo de caja.');
  if(estab >= 75) fortalezas.push('Estabilidad emocional frente a la presión y la corrección.');
  if(resil >= 75) fortalezas.push('Resiliencia comercial: maneja objeciones de precio sin perder la venta.');
  if(apert >= 75) fortalezas.push('Iniciativa y apertura al aprendizaje; ideal para crecer a encargada.');
  if(pctMem >= 80) fortalezas.push('Memoria visual sobresaliente; útil para ubicación rápida de productos.');
  if(pctCal >= 80) fortalezas.push('Cálculo rápido y preciso para caja.');

  // Narrativa
  const nombrePila = (S.registro.nombre||'').split(' ')[0] || 'La postulante';
  let narrativa = `<b>${nombrePila}</b> obtiene un perfil conductual promedio de <b>${Math.round(prom)}/100</b>, `;
  if(prom>=75) narrativa += `colocándose en el rango <b>ideal para atención directa al cliente</b> en tienda de accesorios. `;
  else if(prom>=60) narrativa += `colocándose en un rango <b>prometedor</b> que amerita validación en entrevista presencial y prueba en tienda. `;
  else if(prom>=45) narrativa += `en un rango <b>moderado</b>; se sugiere evaluar con atención las dimensiones más bajas antes de avanzar. `;
  else narrativa += `en un rango <b>bajo</b>; probablemente no encaje con el perfil requerido para atención al público. `;

  narrativa += `En comunicación y persuasión alcanza <b>${Math.round(pctCom)}%</b>, `;
  narrativa += pctCom>=75 ? 'destacando su capacidad para generar cercanía y cerrar ventas. ' :
               pctCom>=50 ? 'mostrando margen de mejora en el manejo de objeciones y clientes difíciles. ' :
               'reflejando timidez o baja iniciativa para interactuar con el cliente. ';

  narrativa += `En responsabilidad y caja obtiene <b>${Math.round(pctCal)}%</b> en cálculo y <b>${Math.round(pctPers)}%</b> en conducta ética. `;
  narrativa += `La memoria visual (${Math.round(pctMem)}%) `;
  narrativa += pctMem>=70 ? 'es un punto fuerte: retiene con facilidad productos, precios y ubicaciones. ' : 'sugiere reforzar técnicas de atención al detalle. ';

  if(flags.length){
    narrativa += `<br><br><b>⚠️ Alertas de integridad detectadas durante el test:</b> ` + flags.join(' ');
  } else {
    narrativa += `<br><br><b>✅ Sin alertas de integridad.</b> El test se completó en ${S.flags.tiempoTotal}s sin cambios de pestaña ni intentos de pegado.`;
  }

  narrativa += `<br><br><b>Recomendación de la auditoría:</b> `;
  if(prom>=75 && flags.length===0) narrativa += `Avanzar a <b>entrevista presencial</b> y prueba en tienda de 2 horas. Alta probabilidad de encaje con el perfil SAFRI.`;
  else if(prom>=60) narrativa += `Citar a entrevista y centrar la evaluación en las dimensiones más débiles detectadas. Considerar prueba en tienda supervisada.`;
  else if(prom>=45) narrativa += `Mantener como reserva. Si no hay mejores candidatas, citar a entrevista y validar con casos prácticos.`;
  else narrativa += `Descartar para atención al cliente. Podría considerarse para roles de inventario o logística sin trato directo.`;

  return {
    dimensiones:{
      'Extroversión y carisma': Math.round(extro),
      'Amabilidad y empatía': Math.round(amab),
      'Responsabilidad y ética': Math.round(respo),
      'Estabilidad emocional': Math.round(estab),
      'Apertura e iniciativa': Math.round(apert),
      'Resiliencia comercial': Math.round(resil)
    },
    promedio: Math.round(prom),
    perfil, perfilColor,
    fortalezas,
    riesgos,
    narrativa
  };
}

  if(p === ADMIN_PASSWORD) vAdmin();
  else if(p !== null) alert('Clave incorrecta.');
}

function vAdmin(){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  render(`
  <div class="card">
    <h2>🔐 Panel de administrador</h2>
    <div class="notice info">Aquí ves los test guardados en ESTE dispositivo. Si los postulantes usaron su propio celular, pega abajo el código que te enviaron por WhatsApp.</div>
    <h3>1) Evaluar por código recibido</h3>
    <textarea id="inpCode" placeholder="Pega aquí el código del postulante..." style="min-height:80px"></textarea>
    <br><br>
    <button class="btn" onclick="evalCode()">Evaluar código</button>
    <h3 style="margin-top:22px">2) Postulantes guardados en este dispositivo (${lista.length})</h3>
    ${lista.length===0 ? '<p style="color:var(--muted);font-size:13px">Aún no hay registros locales.</p>' :
      `<table>
        <tr><th>Fecha</th><th>Nombre</th><th>Modalidad</th><th>Psico</th><th>Pers.</th><th>Com.</th><th>Mem.</th><th>Caja</th><th>Alertas</th><th></th></tr>
        ${lista.map((r,i)=>`
          <tr>
            <td>${new Date(r.fecha).toLocaleDateString()}</td>
            <td>${esc(r.nombre)}</td>
            <td>${esc(r.modalidad)}</td>
            <td><b>${r.psicometrico?.promedio ?? '-'}</b></td>
            <td>${r.puntajes.personalidad}/${r.puntajes.maxPersonalidad}</td>
            <td>${r.puntajes.comunicacion ?? '-'}/${r.puntajes.maxComunicacion ?? '-'}</td>
            <td>${r.puntajes.memoria}/${r.puntajes.maxMemoria}</td>
            <td>${r.puntajes.calculo}/${r.puntajes.maxCalculo}</td>
            <td>${r.flags.length ? `<span class="tag p">${r.flags.length}</span>` : '<span class="tag g">0</span>'}</td>
            <td><button class="btn-ghost btn" style="padding:5px 10px;font-size:12px" onclick="verDetalle(${i})">Ver</button></td>
          </tr>`).join('')}
      </table>`}
    <h3 style="margin-top:22px">3) Exportar todo (CSV)</h3>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇️ Descargar CSV</button>
    <button class="btn btn-ghost" onclick="borrarTodo()">🗑️ Borrar registros locales</button>

  </div>`);

function evalCode(){
  const code = $('inpCode').value.trim();
  const r = decodeRes(code);
  if(!r){ alert('Código inválido.'); return; }
  $('detalleBox').innerHTML = renderDetalle(r);
  $('detalleBox').scrollIntoView({behavior:'smooth'});
}

function verDetalle(i){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  $('detalleBox').innerHTML = renderDetalle(lista[i]);
  $('detalleBox').scrollIntoView({behavior:'smooth'});
}

function renderDetalle(r){
  const pct = Math.round(100 * r.puntajes.personalidad / r.puntajes.maxPersonalidad);
  const pctCom = r.puntajes.maxComunicacion ? Math.round(100 * r.puntajes.comunicacion / r.puntajes.maxComunicacion) : 0;
  const pctM = Math.round(100 * r.puntajes.memoria / r.puntajes.maxMemoria);
  const pctC = Math.round(100 * r.puntajes.calculo / r.puntajes.maxCalculo);

  const pers = PREGUNTAS_PERSONALIDAD.map(q=>{
    const a = r.respuestas.personalidad[q.id];
    return `<div class="qa"><div class="q">${esc(q.texto)}</div><div class="a">→ ${a?esc(a.txt)+' ('+a.p+' pts)':'Sin respuesta'}</div></div>`;
  }).join('');
  const com = PREGUNTAS_COMUNICACION.map(q=>{
    const a = r.respuestas.comunicacion?.[q.id];
    return `<div class="qa"><div class="q">${esc(q.texto)}</div><div class="a">→ ${a?esc(a.txt)+' ('+a.p+' pts)':'Sin respuesta'}</div></div>`;
  }).join('');
  const mem = PREGUNTAS_MEMORIA.map(q=>{
    const a = r.respuestas.memoria[q.id];
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">→ ${a?esc(a.txt)+(a.correcta?' ✅':' ❌'):'Sin respuesta'}</div></div>`;
  }).join('');
  const cal = PREGUNTAS_CALCULO.map((q,i)=>{
    const a = r.respuestas.calculo[q.id];
    const t = r.tiemposCalculo?.[i];
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">→ ${a?esc(a.txt)+(a.correcta?' ✅':' ❌'):'Sin respuesta'}${t?` (${t}s)`:''}</div></div>`;
  }).join('');
  const ab = PREGUNTAS_ABIERTAS.map(q=>{
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">"${esc(r.respuestas.abiertas[q.id]||'')}"</div></div>`;
  }).join('');

  // Bloque psicométrico
  let psicoHTML = '';
  if(r.psicometrico){
    const p = r.psicometrico;
    const dims = Object.entries(p.dimensiones).map(([k,v])=>{
      const color = v>=75 ? 'linear-gradient(90deg,#10b981,#059669)' :
                    v>=55 ? 'linear-gradient(90deg,#f59e0b,#d97706)' :
                            'linear-gradient(90deg,#ef4444,#b91c1c)';
      return `<div class="psy-dim"><label><span>${k}</span><b>${v}/100</b></label>
        <div class="psy-bar"><div style="width:${v}%;background:${color}"></div></div></div>`;
    }).join('');
    psicoHTML = `
      <div class="psy-box">
        <h4>🤖 AUDITORÍA PSICOMÉTRICA (IA)</h4>
        <p style="font-size:14px;margin-bottom:12px">
          <span class="chip ${p.perfilColor}">${esc(p.perfil)}</span>
          &nbsp;·&nbsp; Perfil conductual: <b>${p.promedio}/100</b>
        </p>
        ${dims}
        ${p.fortalezas.length ? `<div style="margin-top:12px"><b style="color:#065f46;font-size:13px">✅ Fortalezas detectadas</b><ul style="margin-left:18px;font-size:13px;line-height:1.7;color:#374151">${p.fortalezas.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}
        ${p.riesgos.length ? `<div style="margin-top:10px"><b style="color:#991b1b;font-size:13px">⚠️ Riesgos detectados</b><ul style="margin-left:18px;font-size:13px;line-height:1.7;color:#374151">${p.riesgos.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}
        <div class="psy-narrative">${p.narrativa}</div>
      </div>`;
  }

  return `
  <div class="detail" style="margin-top:20px;border:2px solid var(--primary)">
    <h4 style="font-size:16px">👤 ${esc(r.nombre)}</h4>
    <p style="font-size:13px;color:var(--muted)">
      DNI: ${esc(r.dni)} · Edad: ${esc(r.edad)} · ${esc(r.distrito)} · ${esc(r.grado)}<br>
      📧 ${esc(r.correo)} · 📱 ${esc(r.telefono)}<br>
      Modalidad: <b>${esc(r.modalidad)}</b> · Turno: ${esc(r.turno)} · Permanencia: ${esc(r.permanencia)}<br>
      Disponibilidad: ${esc(r.disponibilidad)} · Aspiración: S/ ${esc(r.sueldo)}<br>
      Fecha: ${new Date(r.fecha).toLocaleString()}
    </p>
    <h4>Puntajes</h4>
    <p style="font-size:13px">
      Personalidad: <b>${r.puntajes.personalidad}/${r.puntajes.maxPersonalidad}</b> (${pct}%)<br>
      Comunicación y persuasión: <b>${r.puntajes.comunicacion ?? '-'}/${r.puntajes.maxComunicacion ?? '-'}</b> (${pctCom}%)<br>
      Memoria visual: <b>${r.puntajes.memoria}/${r.puntajes.maxMemoria}</b> (${pctM}%)<br>
      Cálculo caja: <b>${r.puntajes.calculo}/${r.puntajes.maxCalculo}</b> (${pctC}%)<br>
      Tiempo total: <b>${r.flagCount.tiempoTotal} s</b> · Cambios pestaña: <b>${r.flagCount.tab}</b> · Pegados: <b>${r.flagCount.paste}</b>
    </p>
    ${psicoHTML}
    ${r.flags.length ? `<h4>⚠️ Alertas de integridad</h4><ul style="margin-left:18px;font-size:13px;color:#991b1b">${r.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <h4>Sección 1: Personalidad</h4>${pers}
    <h4>Sección 2: Comunicación y persuasión</h4>${com}
    <h4>Sección 3: Memoria visual</h4>${mem}
    <h4>Sección 4: Cálculo</h4>${cal}
    <h4>Sección 5: Preguntas abiertas</h4>${ab}
  </div>`;
}

function exportCSV(){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  if(!lista.length){ alert('Sin registros.'); return; }
  const head = ['Fecha','Nombre','DNI','Edad','Correo','Telefono','Grado','Distrito','Modalidad','Permanencia','Turno','Disponibilidad','Sueldo','PjePsicometrico','Perfil','PjePersonalidad','PjeComunicacion','PjeMemoria','PjeCalculo','TiempoSeg','CambiosPestana','Pegados','Flags'];
  const rows = lista.map(r=>[
    new Date(r.fecha).toLocaleString(), r.nombre, r.dni, r.edad, r.correo, r.telefono, r.grado, r.distrito,
    r.modalidad, r.permanencia, r.turno, r.disponibilidad, r.sueldo,
    r.psicometrico?.promedio, r.psicometrico?.perfil,
    r.puntajes.personalidad, r.puntajes.comunicacion, r.puntajes.memoria, r.puntajes.calculo,
    r.flagCount.tiempoTotal, r.flagCount.tab, r.flagCount.paste, r.flags.join(' | ')
  ]);
  const csv = [head, ...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'postulantes_'+Date.now()+'.csv'; a.click();
}

function borrarTodo(){
  if(confirm('¿Borrar todos los registros locales? Esta acción no se puede deshacer.')){
    localStorage.removeItem('postulantes_jm'); vAdmin();
  }
}
