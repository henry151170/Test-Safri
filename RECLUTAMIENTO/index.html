<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reclutamiento — Tienda de Accesorios (Jesús María)</title>
<style>
:root{
  --primary:#7c3aed; --primary-dark:#5b21b6; --accent:#ec4899;
  --bg:#f8f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#f8f7fb,#f3e8ff);color:var(--text);
  min-height:100vh;line-height:1.5;padding:16px}
.wrap{max-width:760px;margin:0 auto}
.header{text-align:center;padding:20px 10px 28px}
.header h1{font-size:22px;color:var(--primary-dark);margin-bottom:6px}
.header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:26px;
  box-shadow:0 4px 24px rgba(124,58,237,.08);margin-bottom:18px}
h2{font-size:18px;color:var(--primary-dark);margin-bottom:14px}
h3{font-size:15px;color:var(--primary-dark);margin:16px 0 8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);
  border-radius:10px;font-size:14px;font-family:inherit;background:#fff;transition:.15s;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{display:inline-block;padding:13px 26px;border:none;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.15s;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost:hover{background:#f3e8ff}
.btn-full{width:100%}
.opt{display:block;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:10px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
.opt:hover{border-color:var(--primary);background:#faf5ff}
.opt.sel{border-color:var(--primary);background:#f3e8ff;font-weight:600}
.opt input{display:none}
.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.3s}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.good{background:#d1fae5;color:#065f46}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.bad{background:#fee2e2;color:#991b1b}
.chip.info{background:#e0e7ff;color:#3730a3}
.notice{background:#fef3c7;border-left:4px solid var(--warn);padding:12px 14px;
  border-radius:8px;font-size:13px;margin-bottom:16px;color:#78350f}
.notice.info{background:#e0e7ff;border-color:var(--primary);color:#3730a3}
.notice.danger{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.timer{font-size:34px;font-weight:700;color:var(--accent);text-align:center;margin:10px 0}
.prod-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.prod{background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:12px;font-size:14px}
.prod b{color:var(--primary-dark)}
.seq{font-size:38px;font-weight:800;letter-spacing:12px;text-align:center;
  color:var(--primary-dark);padding:24px;background:#f3e8ff;border-radius:12px;margin:16px 0}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.result-box{text-align:center;padding:26px;background:#f3e8ff;border-radius:14px;margin:14px 0}
.code-box{background:#1f2937;color:#a7f3d0;padding:14px;border-radius:10px;
  font-family:monospace;font-size:12px;word-break:break-all;max-height:180px;overflow:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f9fafb;font-weight:600;color:#374151;font-size:12px;text-transform:uppercase}
tr:hover td{background:#faf5ff}
.admin-link{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
.admin-link a{color:var(--muted);text-decoration:none;cursor:pointer}
.admin-link a:hover{color:var(--primary)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:4px}
.tag.p{background:#fee2e2;color:#991b1b}
.tag.n{background:#fef3c7;color:#92400e}
.tag.g{background:#d1fae5;color:#065f46}
.detail{background:#f9fafb;border-radius:10px;padding:14px;margin:10px 0;font-size:13px}
.detail h4{font-size:13px;color:var(--primary-dark);margin:10px 0 6px}
.detail .qa{margin-bottom:8px}
.detail .qa .q{font-weight:600;color:#374151}
.detail .qa .a{color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🌟 Reclutamiento — Tienda de Accesorios</h1>
    <p>Jesús María, Lima · Proceso de selección de personal</p>
  </div>
  <div id="app"></div>
  <div class="admin-link">
    <a onclick="pedirAdmin()">Acceso administrador</a>
  </div>
</div>

<script>
/* ============================================================

const ADMIN_PASSWORD = 'Tienda2024*';   // ← Cambia esta clave

  "Lince","Los Olivos","Lurigancho-Chosica","Lurín","Magdalena del Mar","Miraflores","Pachacámac",
  "Pucusana","Pueblo Libre","Puente Piedra","Punta Hermosa","Punta Negra","Rímac","San Bartolo",
  "San Borja","San Isidro","San Juan de Lurigancho","San Juan de Miraflores","San Luis",

/* ============================================================
   PREGUNTAS DE PERSONALIDAD
   — TODAS las opciones están camufladas: ninguna es obviamente mala.
   — Las "buenas" (p:2 o 3) son específicas y accionables.

const PREGUNTAS_PERSONALIDAD = [
  { id:'p1', texto:'Cuando no hay clientes en la tienda, lo primero que haces es:',
    opciones:[
      {t:'Adelanto pendientes personales rápidos (responder mensajes, coordinar algo), así no dejo cosas para después.', p:-2},

    opciones:[

      {t:'Es una oportunidad para aprender de ventas y luego emprender algo mío.', p:-1},
      {t:'Me gusta tratar con personas y asumir más responsabilidades con el tiempo.', p:2}
    ]},
  { id:'p6', texto:'Cuando tienes un problema familiar serio, ¿qué haces con tu trabajo?',
    opciones:[
      {t:'Lo resuelvo sin afectar mi trabajo, aunque tenga que pedir salir unos minutos.', p:-1},
      {t:'Aviso con anticipación a la encargada y coordino cómo cubrir mi turno.', p:3},
      {t:'Busco solución con el equipo y cumplo mi horario sin descuidar mi responsabilidad.', p:2},
      {t:'Priorizo mi familia; si es grave, dejo el trabajo para no fallar en ninguno de los dos lados.', p:-2}
    ]},
  { id:'p7', texto:'Si la encargada te corrige frente a un cliente:',
    opciones:[
      {t:'Acepto delante del cliente, termino la atención y luego converso en privado con ella.', p:3},
      {t:'Le hago una seña discreta para que no siga delante del cliente y luego aclaro.', p:-1},
      {t:'Sigo atendiendo y en privado le explico mi versión de los hechos.', p:-1},
      {t:'Me concentro en el cliente y luego le pido a la encargada que me diga cómo mejorar.', p:2}
    ]},
  { id:'p8', texto:'Sobre el uso del celular en horario de trabajo:',
    opciones:[
      {t:'Lo uso brevemente para coordinar temas personales urgentes; hoy todos lo hacemos.', p:-2},
      {t:'Lo mantengo guardado; solo lo reviso en mi refrigerio y en emergencias reales.', p:3},

      {t:'Me quedo solo si la encargada también se queda; así no me quedo sola.', p:-1},
      {t:'Prefiero cumplir mi horario; lo de la tienda no debería ser mi problema fuera de hora.', p:-2}
    ]},
  { id:'p10', texto:'Al cerrar el día, el sistema muestra S/ 30 de más respecto a lo que hay físicamente en caja. ¿Qué haces?',
    opciones:[
      {t:'Lo pongo como sobrante y lo reporto en el cierre del mes, para no hacer ajustes diarios.', p:-1},
      {t:'Lo reporto por escrito a la encargada en el momento y dejo constancia firmada.', p:3},
      {t:'Reviso las boletas del día para ver si fue un vuelto mal dado y aviso de inmediato.', p:2},
      {t:'Lo guardo en un sobre con una nota y lo comento al día siguiente.', p:0}
    ]},
  { id:'p11', texto:'Una clienta mayor te pide ayuda para elegir un regalo y tú no conoces bien el producto:',
    opciones:[
      {t:'Le muestro los productos más populares del mes; suelen gustar a todos.', p:0},
      {t:'Le pregunto para quién es, su presupuesto y ocasión, y le muestro opciones con calma.', p:3},
      {t:'Le sugiero que espere a la encargada, ella conoce mejor el producto.', p:-1},
      {t:'Le muestro 2 o 3 opciones y le explico las diferencias con calma.', p:2}
    ]},
  { id:'p12', texto:'¿Cómo reaccionas si te dicen que tu horario cambiará la próxima semana (mañana por tarde)?',
    opciones:[
      {t:'Me adapto, entiendo que la tienda lo necesita; luego coordino detalles con la encargada.', p:3},
      {t:'Aviso que no puedo, tengo otras responsabilidades asumidas para ese horario.', p:-1},
      {t:'Lo converso con mis compañeras primero para ver quién puede apoyar.', p:-1},
      {t:'Pregunto el motivo y coordino con la encargada cómo organizarnos.', p:3}
    ]}
];

/* ============================================================
   PRUEBA DE MEMORIA — SIMPLIFICADA
   5 productos, 25 segundos (antes 8 productos, 20 segundos)
   ============================================================ */
const PRODUCTOS_MEMORIA = [
  {n:'Cartera negra',    p:89},
  {n:'Aretes dorados',   p:25},
  {n:'Blusa floreada',   p:45},
  {n:'Collar de perlas', p:60},
  {n:'Pulsera de plata', p:35}
];
const PREGUNTAS_MEMORIA = [
  {id:'m1', t:'¿Cuánto costaba el collar de perlas?', ops:['S/ 45','S/ 60','S/ 35','S/ 89'], ok:1},
  {id:'m2', t:'¿Qué artículo costaba S/ 45?', ops:['Pulsera de plata','Blusa floreada','Aretes dorados','Collar de perlas'], ok:1},
  {id:'m3', t:'¿Cuál era el artículo más barato?', ops:['Aretes dorados','Pulsera de plata','Blusa floreada','Collar de perlas'], ok:0},
  {id:'m4', t:'¿Cuántos artículos costaban más de S/ 50?', ops:['1','2','3','Ninguno'], ok:1},
  {id:'m5', t:'¿Cuál era el precio de la cartera negra?', ops:['S/ 60','S/ 89','S/ 95','S/ 45'], ok:1}
];
const SECUENCIA_MEMORIA = '4 7 2 9 1';

/* ============================================================
   PRUEBA DE CÁLCULO
   ============================================================ */
const PREGUNTAS_CALCULO = [
  {id:'c1', t:'Un cliente compra: cartera S/ 89 + aretes S/ 25 + blusa S/ 45. Paga con S/ 200. ¿Cuál es el vuelto?',
    ops:['S/ 41','S/ 51','S/ 31','S/ 45'], ok:0},
  {id:'c2', t:'Aplica un 20% de descuento a un producto de S/ 150. ¿Cuál es el precio final?',
    ops:['S/ 130','S/ 135','S/ 120','S/ 125'], ok:2},
  {id:'c3', t:'En caja tienes: 3 billetes de S/ 50, 5 de S/ 20, 8 monedas de S/ 5 y 12 monedas de S/ 1. ¿Cuánto hay en total?',
    ops:['S/ 302','S/ 312','S/ 292','S/ 282'], ok:0},
  {id:'c4', t:'Si 3 carteras cuestan S/ 240, ¿cuánto cuesta 1 cartera?',
    ops:['S/ 60','S/ 80','S/ 90','S/ 70'], ok:1},
  {id:'c5', t:'¿Cuál es el 15% de S/ 80?',
    ops:['S/ 15','S/ 10','S/ 12','S/ 14'], ok:2},
  {id:'c6', t:'Una blusa de S/ 60 tiene 25% de descuento. ¿Cuál es el precio final?',
    ops:['S/ 45','S/ 40','S/ 50','S/ 55'], ok:0},
  {id:'c7', t:'Cuadre del día: ventas S/ 1250. En caja hay S/ 1180 + Yape/Plin S/ 45. ¿Falta o sobra y cuánto?',
    ops:['Sobra S/ 25','Falta S/ 25','Falta S/ 30','Está exacto'], ok:1},
  {id:'c8', t:'Un cliente paga S/ 100 por 2 artículos de S/ 35 cada uno. ¿Cuál es el vuelto?',
    ops:['S/ 25','S/ 30','S/ 35','S/ 20'], ok:1}
];

/* ============================================================
   PREGUNTAS ABIERTAS (anti-IA)
   ============================================================ */
const PREGUNTAS_ABIERTAS = [
  {id:'a1', t:'Describe brevemente tu último trabajo o, si nunca has trabajado, una situación en la que asumiste una responsabilidad (casa, estudios, voluntariado). Incluye: la inicial del nombre de una persona involucrada y el mes aproximado.',
   maxPalabras:60},
  {id:'a2', t:'¿Cuál es tu distrito de residencia y cuánto tiempo demoras en llegar a Jesús María? Menciona el transporte exacto que usarías (línea de bus, metro, combi, etc.).',
   maxPalabras:40},
  {id:'a3', t:'Escribe una frase que te haya dicho un familiar o profesor y que recuerdes hasta hoy. Indica quién te la dijo (solo inicial) y en qué contexto.',
   maxPalabras:40},
  {id:'a4', t:'Si tuvieras que vender una cartera de S/ 120 a una clienta que dice "está muy cara", ¿qué le dirías? Escribe EXACTAMENTE las palabras que usarías, como si estuvieras hablando.',
   maxPalabras:50}
];

/* ============================================================
   UTILIDADES
   ============================================================ */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function render(html){$('app').innerHTML=html;}
function encodeRes(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function decodeRes(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim()))));}catch(e){return null;}}

let S = {
  registro:{}, respuestas:{personalidad:{},memoria:{},calculo:{},abiertas:{}},
  orden:{}, flags:{tab:0,paste:0,inicio:null,fin:null}, paso:0
};

/* ============================================================
   REGISTRO
   ============================================================ */
function vRegistro(){
  const distritos = DISTRITOS_LIMA.map(d=>`<option value="${d}">${d}</option>`).join('');
  const grados = GRADOS.map(g=>`<option value="${g}">${g}</option>`).join('');
  render(`
  <div class="card">
    <h2>📋 Datos del postulante</h2>
    <div class="notice info">Completa tus datos y luego continúa con el test. El proceso tiene 4 etapas: test → entrevista → prueba en tienda (2 h) → aprobación y contrato.</div>
    <form id="fReg" onsubmit="return guardarRegistro(event)">
      <div class="field"><label>Nombre completo *</label>
        <input required name="nombre" placeholder="Ej. María Fernanda Quispe Rojas"></div>
      <div class="row">
        <div class="field"><label>Número de documento *</label>
          <input required name="dni" pattern="[0-9]{8,12}" title="Solo números (8 a 12 dígitos)" placeholder="Ej. 74581236"></div>
        <div class="field"><label>Edad *</label>
          <input required name="edad" type="number" min="16" max="70" placeholder="Ej. 22"></div>
      </div>
      <div class="row">
        <div class="field"><label>Correo electrónico *</label>
          <input required name="correo" type="email" placeholder="tucorreo@gmail.com"></div>
        <div class="field"><label>Número telefónico *</label>
          <input required name="telefono" pattern="[0-9+ ]{9,15}" placeholder="Ej. 987654321"></div>
      </div>
      <div class="field"><label>Grado de instrucción *</label>
        <select required name="grado"><option value="">-- Selecciona --</option>${grados}</select></div>
      <div class="field"><label>Distrito de residencia *</label>
        <select required name="distrito"><option value="">-- Selecciona --</option>${distritos}</select></div>
      <div class="row">
        <div class="field"><label>Modalidad *</label>
          <select required name="modalidad" onchange="actualizarTurno()">
            <option value="">-- Selecciona --</option>
            <option value="Full time">Full time</option>
            <option value="Part time">Part time</option>
          </select></div>
        <div class="field"><label>Permanencia mínima *</label>
          <select required name="permanencia">
            <option value="">-- Selecciona --</option>
            <option value="3 meses">3 meses</option>
            <option value="6 meses">6 meses</option>
            <option value="Más de un año">Más de un año</option>
          </select></div>
      </div>
      <div class="field"><label>Turno disponible *</label>
        <select required name="turno" id="selTurno">
          <option value="">-- Primero elige modalidad --</option>
        </select></div>
      <div class="row">
        <div class="field"><label>Disponibilidad inmediata *</label>
          <select required name="disponibilidad"><option value="">-- Selecciona --</option>
            <option value="Sí">Sí</option><option value="No">No</option></select></div>
        <div class="field"><label>Aspiración económica (S/) *</label>
          <input required name="sueldo" type="number" min="0" step="50" placeholder="Ej. 1200"></div>
      </div>
      <button class="btn btn-full" type="submit">Continuar al test →</button>
    </form>
  </div>`);
}

function actualizarTurno(){
  const m = document.querySelector('[name=modalidad]').value;
  const sel = $('selTurno');
  let op = '<option value="">-- Selecciona turno --</option>';
  if(m==='Full time'){
    op += '<option value="9:00 a 18:00 (1 h refrigerio)">9:00 a 18:00 (1 h refrigerio)</option>';
    op += '<option value="14:00 a 22:00">14:00 a 22:00</option>';
  } else if(m==='Part time'){
    op += '<option value="10:00 a 14:00">10:00 a 14:00</option>';
    op += '<option value="18:00 a 22:00">18:00 a 22:00</option>';
  }
  sel.innerHTML = op;
}

function guardarRegistro(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  S.registro = Object.fromEntries(fd);
  const edad = +S.registro.edad;
  if(edad < 18 && S.registro.modalidad==='Full time'){
    if(!confirm('Tienes menos de 18 años y elegiste Full time. ¿Deseas continuar?')) return false;
  }
  PREGUNTAS_PERSONALIDAD.forEach(q=>{ S.orden[q.id] = shuffle(q.opciones.map((o,i)=>({...o, orig:i}))); });
  PREGUNTAS_MEMORIA.forEach(q=>{ S.orden[q.id] = shuffle(q.ops.map((o,i)=>({o, i}))); });
  PREGUNTAS_CALCULO.forEach(q=>{ S.orden[q.id] = shuffle(q.ops.map((o,i)=>({o, i}))); });
  S.flags.inicio = Date.now();
  vIntroTest();
  return false;
}

/* ============================================================
   INTRO DEL TEST
   ============================================================ */
function vIntroTest(){
  render(`
  <div class="card">
    <h2>📝 Test de selección</h2>
    <div class="notice danger">
      <b>Lee con atención:</b> este test tiene 4 secciones:
      <ol style="margin:8px 0 0 18px">
        <li>Personalidad y actitud (12 preguntas)</li>
        <li>Prueba de memoria (con tiempo limitado)</li>
        <li>Prueba de cálculo para caja</li>
        <li>Preguntas abiertas (respuestas personales)</li>
      </ol>
    </div>
    <div class="notice">
      ⚠️ El sistema registra el tiempo, los cambios de pestaña y los intentos de copiar/pegar.
      Responde con sinceridad. <b>No busques respuestas en internet o con IA:</b> las preguntas
      abiertas son personales y no se pueden responder sin tu experiencia real.
    </div>
    <button class="btn btn-full" onclick="vPersonalidad(0)">Comenzar test →</button>
  </div>`);
}

/* ============================================================
   SECCIÓN 1: PERSONALIDAD
   ============================================================ */
function vPersonalidad(i){
  if(i >= PREGUNTAS_PERSONALIDAD.length){ return vMemoria1(); }
  const q = PREGUNTAS_PERSONALIDAD[i];
  const ops = S.orden[q.id];
  const total = PREGUNTAS_PERSONALIDAD.length;
  const prog = (i/total)*100;
  render(`
  <div class="card">
    <div class="progress"><div style="width:${prog}%"></div></div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Pregunta ${i+1} de ${total} · Sección 1</p>
    <h2>${esc(q.texto)}</h2>
    <div id="ops">
      ${ops.map((o,k)=>`
        <label class="opt" onclick="selPers('${q.id}',${k},'${esc(o.t).replace(/'/g,"\\'")}',${o.p})">
          ${esc(o.t)}
        </label>`).join('')}
    </div>
    <button class="btn" id="btnNext" disabled onclick="vPersonalidad(${i+1})">Siguiente →</button>
  </div>`);
  window.selPers = function(qid, k, txt, p){
    S.respuestas.personalidad[qid] = {txt, p};
    document.querySelectorAll('#ops .opt').forEach(el=>el.classList.remove('sel'));
    document.querySelectorAll('#ops .opt')[k].classList.add('sel');
    $('btnNext').disabled = false;
  };
}

/* ============================================================
   SECCIÓN 2: MEMORIA
   ============================================================ */
function vMemoria1(){
  render(`
  <div class="card">
    <h2>🧠 Prueba de memoria — Parte 1</h2>
    <div class="notice">Memoriza los siguientes <b>5 productos</b> y sus precios. Tendrás <b>25 segundos</b>. No tomes notas.</div>
    <div class="timer" id="tmr">25</div>
    <div class="prod-list">
      ${PRODUCTOS_MEMORIA.map(p=>`<div class="prod">${esc(p.n)}<br><b>S/ ${p.p}</b></div>`).join('')}
    </div>
  </div>`);
  let t = 25;
  const iv = setInterval(()=>{
    t--; const el=$('tmr'); if(el) el.textContent=t;
    if(t<=0){ clearInterval(iv); vMemoria2(); }
  },1000);
}

function vMemoria2(){
  render(`
  <div class="card">
    <h2>🧠 Prueba de memoria — Preguntas</h2>
    <div class="notice">Responde según lo que recuerdes. No vuelvas atrás.</div>
    ${PREGUNTAS_MEMORIA.map((q,i)=>`
      <div class="field">
        <label>${i+1}. ${esc(q.t)}</label>
        <div>
          ${S.orden[q.id].map((o,k)=>`
            <label class="opt" onclick="selMem('${q.id}',${k},'${esc(o.o)}',${o.i})">
              ${esc(o.o)}
            </label>`).join('')}
        </div>
      </div>`).join('')}
    <button class="btn" id="btnMem" disabled onclick="vMemoria3()">Continuar →</button>
  </div>`);
  window.selMem = function(qid,k,txt,origIdx){
    S.respuestas.memoria[qid] = {txt, origIdx, correcta: PREGUNTAS_MEMORIA.find(p=>p.id===qid).ok === origIdx};
    const q = PREGUNTAS_MEMORIA.find(p=>p.id===qid);
    const idx = PREGUNTAS_MEMORIA.indexOf(q);
    const cont = document.querySelectorAll('.field')[idx];
    cont.querySelectorAll('.opt').forEach(el=>el.classList.remove('sel'));
    cont.querySelectorAll('.opt')[k].classList.add('sel');
    if(Object.keys(S.respuestas.memoria).length === PREGUNTAS_MEMORIA.length) $('btnMem').disabled = false;
  };
}

function vMemoria3(){
  render(`
  <div class="card">
    <h2>🧠 Prueba de memoria — Secuencia</h2>
    <div class="notice">Memoriza la siguiente secuencia. Tendrás <b>8 segundos</b>.</div>
    <div class="timer" id="tmr2">8</div>
    <div class="seq" id="seqBox">${SECUENCIA_MEMORIA}</div>
  </div>`);
  let t = 8;
  const iv = setInterval(()=>{
    t--; const el=$('tmr2'); if(el) el.textContent=t;
    if(t<=0){ clearInterval(iv); $('seqBox').textContent='• • • • •'; vMemoria4(); }
  },1000);
}

function vMemoria4(){
  render(`
  <div class="card">
    <h2>🧠 Escribe la secuencia que viste</h2>
    <div class="notice">Escríbela con espacios entre números (ej. 1 2 3 4 5).</div>
    <input id="inpSeq" placeholder="Escribe la secuencia..." autocomplete="off">
    <br><br>
    <button class="btn" onclick="guardarSeq()">Continuar →</button>
  </div>`);
}

function guardarSeq(){
  const v = ($('inpSeq').value||'').replace(/\s+/g,' ').trim();
  S.respuestas.memoria.secuencia = {txt:v, correcta: v === SECUENCIA_MEMORIA};
  vCalculo(0);
}

/* ============================================================
   SECCIÓN 3: CÁLCULO
   ============================================================ */
function vCalculo(i){
  if(i >= PREGUNTAS_CALCULO.length){ return vAbiertas(); }
  const q = PREGUNTAS_CALCULO[i];
  const ops = S.orden[q.id];
  const total = PREGUNTAS_CALCULO.length;
  const prog = (i/total)*100;
  render(`
  <div class="card">
    <div class="progress"><div style="width:${prog}%"></div></div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Pregunta ${i+1} de ${total} · Sección 3 (Caja)</p>
    <h2>${esc(q.t)}</h2>
    <div id="opsC">
      ${ops.map((o,k)=>`
        <label class="opt" onclick="selCal('${q.id}',${k},'${esc(o.o)}',${o.i})">
          ${esc(o.o)}
        </label>`).join('')}
    </div>
    <button class="btn" id="btnC" disabled onclick="vCalculo(${i+1})">Siguiente →</button>
  </div>`);
  window.selCal = function(qid,k,txt,origIdx){
    S.respuestas.calculo[qid] = {txt, origIdx, correcta: PREGUNTAS_CALCULO.find(p=>p.id===qid).ok === origIdx};
    document.querySelectorAll('#opsC .opt').forEach(el=>el.classList.remove('sel'));
    document.querySelectorAll('#opsC .opt')[k].classList.add('sel');
    $('btnC').disabled = false;
  };
}

/* ============================================================
   SECCIÓN 4: PREGUNTAS ABIERTAS
   ============================================================ */
function vAbiertas(){
  render(`
  <div class="card">
    <h2>✍️ Preguntas abiertas</h2>
    <div class="notice danger">
      <b>Importante:</b> responde con tus propias palabras. No copies de internet ni de IA.
      El sistema detecta cambios de pestaña y copiado/pegado. Respuestas genéricas serán penalizadas.
    </div>
    ${PREGUNTAS_ABIERTAS.map((q,i)=>`
      <div class="field">
        <label>${i+1}. ${esc(q.t)} <span style="color:var(--muted);font-weight:400">(máx. ${q.maxPalabras} palabras)</span></label>
        <textarea data-qid="${q.id}" data-max="${q.maxPalabras}"
          oninput="contarPalabras(this)" onpaste="marcarPaste(event)"></textarea>
        <div class="counter"><span>0</span>/${q.maxPalabras} palabras</div>
      </div>`).join('')}
    <button class="btn btn-full" onclick="finalizarTest()">Finalizar y enviar test</button>
  </div>`);
}

function contarPalabras(el){
  const w = (el.value.trim().match(/\S+/g)||[]).length;
  el.parentElement.querySelector('.counter span').textContent = w;
  el.parentElement.querySelector('.counter').style.color = w > +el.dataset.max ? 'var(--bad)' : 'var(--muted)';
}

function marcarPaste(e){
  e.preventDefault();
  S.flags.paste++;
  alert('Por seguridad, no está permitido pegar texto. Escribe tu respuesta con tus propias palabras.');
}

/* ============================================================
   FINALIZAR
   ============================================================ */
function finalizarTest(){
  const tas = document.querySelectorAll('textarea[data-qid]');
  for(const t of tas){
    if(t.value.trim().length < 15){ alert('Por favor responde todas las preguntas abiertas con al menos una frase.'); t.focus(); return; }
    S.respuestas.abiertas[t.dataset.qid] = t.value.trim();
  }
  S.flags.fin = Date.now();
  S.flags.tiempoTotal = Math.round((S.flags.fin - S.flags.inicio)/1000);

  let pPers = 0, maxPers = 0;
  PREGUNTAS_PERSONALIDAD.forEach(q=>{ pPers += S.respuestas.personalidad[q.id]?.p ?? 0; maxPers += 3; });
  let pMem = 0;
  Object.values(S.respuestas.memoria).forEach(m=>{ if(m.correcta) pMem++; });
  let pCal = 0;
  Object.values(S.respuestas.calculo).forEach(c=>{ if(c.correcta) pCal++; });

  const flags = [];
  if(S.flags.tiempoTotal < TIEMPO_MINIMO_TEST) flags.push('Tiempo total muy bajo ('+S.flags.tiempoTotal+'s) — posible uso de IA o respuestas al azar.');
  if(S.flags.tab > 2) flags.push('Cambios de pestaña detectados ('+S.flags.tab+') — posible búsqueda externa.');
  if(S.flags.paste > 0) flags.push('Intento(s) de pegar texto ('+S.flags.paste+') — posible uso de IA.');
  if(S.registro.modalidad === 'Full time' && S.registro.permanencia === '3 meses')
    flags.push('Coherencia: eligió Full time pero permanencia de solo 3 meses.');

  const resultado = {
    ...S.registro,
    fecha: new Date().toISOString(),
    puntajes: { personalidad:pPers, maxPersonalidad:maxPers, memoria:pMem, maxMemoria:PREGUNTAS_MEMORIA.length+1, calculo:pCal, maxCalculo:PREGUNTAS_CALCULO.length },
    respuestas: S.respuestas,
    flags,
    flagCount: {tab:S.flags.tab, paste:S.flags.paste, tiempoTotal:S.flags.tiempoTotal},
    abiertas: S.respuestas.abiertas
  };

  try{
    const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
    lista.push(resultado);
    localStorage.setItem('postulantes_jm', JSON.stringify(lista));
  }catch(e){}

  const code = encodeRes(resultado);
  render(`
  <div class="card">
    <h2>✅ Test finalizado</h2>
    <div class="result-box">
      <p>Tu test fue registrado correctamente.</p>
      <p style="margin-top:8px;font-size:13px">Copia el siguiente código y envíalo por WhatsApp al número del aviso.</p>
    </div>
    <h3>Código de postulación</h3>
    <div class="code-box" id="cod">${code}</div>
    <button class="btn btn-full" onclick="copiarCodigo()">📋 Copiar código</button>
    <br><br>
    <button class="btn btn-ghost btn-full" onclick="descargarJSON()">⬇️ Descargar como archivo</button>
    <div class="notice info" style="margin-top:16px">
      Si en los próximos días no recibes respuesta, puedes escribir al mismo WhatsApp. ¡Gracias por tu tiempo!
    </div>
  </div>`);
  window.__lastResult = resultado;
}

function copiarCodigo(){
  const c = $('cod').textContent;
  navigator.clipboard.writeText(c).then(()=>alert('Código copiado. Envíalo por WhatsApp al número de la tienda.'));
}
function descargarJSON(){
  const blob = new Blob([JSON.stringify(window.__lastResult,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'postulacion_'+Date.now()+'.json'; a.click();
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) S.flags.tab++; });

/* ============================================================
   ADMIN
   ============================================================ */
function pedirAdmin(){
  const p = prompt('Ingrese clave de administrador:');
  if(p === ADMIN_PASSWORD) vAdmin();
  else if(p !== null) alert('Clave incorrecta.');
}

function vAdmin(){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  render(`
  <div class="card">
    <h2>🔐 Panel de administrador</h2>
    <div class="notice info">Aquí ves los test guardados en ESTE dispositivo. Si los postulantes usaron su propio celular, pega abajo el código que te enviaron por WhatsApp.</div>
    <h3>1) Evaluar por código recibido</h3>
    <textarea id="inpCode" placeholder="Pega aquí el código del postulante..." style="min-height:80px"></textarea>
    <br><br>
    <button class="btn" onclick="evalCode()">Evaluar código</button>
    <h3 style="margin-top:22px">2) Postulantes guardados en este dispositivo (${lista.length})</h3>
    ${lista.length===0 ? '<p style="color:var(--muted);font-size:13px">Aún no hay registros locales.</p>' :
      `<table>
        <tr><th>Fecha</th><th>Nombre</th><th>Modalidad</th><th>Pers.</th><th>Mem.</th><th>Caja</th><th>Alertas</th><th></th></tr>
        ${lista.map((r,i)=>`
          <tr>
            <td>${new Date(r.fecha).toLocaleDateString()}</td>
            <td>${esc(r.nombre)}</td>
            <td>${esc(r.modalidad)}</td>
            <td>${r.puntajes.personalidad}/${r.puntajes.maxPersonalidad}</td>
            <td>${r.puntajes.memoria}/${r.puntajes.maxMemoria}</td>
            <td>${r.puntajes.calculo}/${r.puntajes.maxCalculo}</td>
            <td>${r.flags.length ? `<span class="tag p">${r.flags.length}</span>` : '<span class="tag g">0</span>'}</td>
            <td><button class="btn-ghost btn" style="padding:5px 10px;font-size:12px" onclick="verDetalle(${i})">Ver</button></td>
          </tr>`).join('')}
      </table>`}
    <h3 style="margin-top:22px">3) Exportar todo (CSV)</h3>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇️ Descargar CSV</button>
    <button class="btn btn-ghost" onclick="borrarTodo()">🗑️ Borrar registros locales</button>
    <h3 style="margin-top:22px">Cómo detectar uso de IA</h3>
    <ul style="font-size:13px;color:var(--muted);margin-left:18px;line-height:1.7">
      <li><b>Tiempo total menor a 4 min:</b> sospechoso.</li>
      <li><b>Cambios de pestaña > 2:</b> pudo buscar respuestas.</li>
      <li><b>Intento de pegar texto:</b> bloqueado y registrado.</li>
      <li><b>Preguntas abiertas sin datos personales</b> (iniciales, meses, línea de bus) → genéricas.</li>
      <li><b>Memoria alta + abiertas vacías:</b> la memoria no se puede consultar en IA; el contraste delata.</li>
    </ul>
    <div id="detalleBox"></div>
  </div>`);
}

function evalCode(){
  const code = $('inpCode').value.trim();
  const r = decodeRes(code);
  if(!r){ alert('Código inválido.'); return; }
  $('detalleBox').innerHTML = renderDetalle(r);
  $('detalleBox').scrollIntoView({behavior:'smooth'});
}

function verDetalle(i){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  $('detalleBox').innerHTML = renderDetalle(lista[i]);
  $('detalleBox').scrollIntoView({behavior:'smooth'});
}

function renderDetalle(r){
  const pct = Math.round(100 * r.puntajes.personalidad / r.puntajes.maxPersonalidad);
  const pctM = Math.round(100 * r.puntajes.memoria / r.puntajes.maxMemoria);
  const pctC = Math.round(100 * r.puntajes.calculo / r.puntajes.maxCalculo);
  const prom = (pct + pctM + pctC)/3;
  let rec = '';
  if(r.flags.length >= 2) rec = '<span class="chip bad">ALERTA — Revisar con cuidado / descartar</span>';
  else if(prom >= 75 && r.flags.length===0) rec = '<span class="chip good">RECOMENDADO para entrevista</span>';
  else if(prom >= 55) rec = '<span class="chip warn">REVISAR en entrevista</span>';
  else rec = '<span class="chip bad">NO RECOMENDADO</span>';

  const pers = PREGUNTAS_PERSONALIDAD.map(q=>{
    const a = r.respuestas.personalidad[q.id];
    return `<div class="qa"><div class="q">${esc(q.texto)}</div><div class="a">→ ${a?esc(a.txt)+' ('+a.p+' pts)':'Sin respuesta'}</div></div>`;
  }).join('');
  const mem = PREGUNTAS_MEMORIA.map(q=>{
    const a = r.respuestas.memoria[q.id];
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">→ ${a?esc(a.txt)+(a.correcta?' ✅':' ❌'):'Sin respuesta'}</div></div>`;
  }).join('') + (r.respuestas.memoria.secuencia ? `<div class="qa"><div class="q">Secuencia</div><div class="a">→ ${esc(r.respuestas.memoria.secuencia.txt)} ${r.respuestas.memoria.secuencia.correcta?'✅':'❌'}</div></div>`:'');
  const cal = PREGUNTAS_CALCULO.map(q=>{
    const a = r.respuestas.calculo[q.id];
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">→ ${a?esc(a.txt)+(a.correcta?' ✅':' ❌'):'Sin respuesta'}</div></div>`;
  }).join('');
  const ab = PREGUNTAS_ABIERTAS.map(q=>{
    return `<div class="qa"><div class="q">${esc(q.t)}</div><div class="a">"${esc(r.respuestas.abiertas[q.id]||'')}"</div></div>`;
  }).join('');

  return `
  <div class="detail" style="margin-top:20px;border:2px solid var(--primary)">
    <h4 style="font-size:16px">👤 ${esc(r.nombre)}</h4>
    <p style="font-size:13px;color:var(--muted)">
      DNI: ${esc(r.dni)} · Edad: ${esc(r.edad)} · ${esc(r.distrito)} · ${esc(r.grado)}<br>
      📧 ${esc(r.correo)} · 📱 ${esc(r.telefono)}<br>
      Modalidad: <b>${esc(r.modalidad)}</b> · Turno: ${esc(r.turno)} · Permanencia: ${esc(r.permanencia)}<br>
      Disponibilidad: ${esc(r.disponibilidad)} · Aspiración: S/ ${esc(r.sueldo)}<br>
      Fecha: ${new Date(r.fecha).toLocaleString()}
    </p>
    <h4>Puntajes</h4>
    <p style="font-size:13px">
      Personalidad: <b>${r.puntajes.personalidad}/${r.puntajes.maxPersonalidad}</b> (${pct}%)<br>
      Memoria: <b>${r.puntajes.memoria}/${r.puntajes.maxMemoria}</b> (${pctM}%)<br>
      Cálculo caja: <b>${r.puntajes.calculo}/${r.puntajes.maxCalculo}</b> (${pctC}%)<br>
      Tiempo total: <b>${r.flagCount.tiempoTotal} s</b> · Cambios pestaña: <b>${r.flagCount.tab}</b> · Pegados: <b>${r.flagCount.paste}</b>
    </p>
    <h4>Recomendación</h4>
    <p>${rec}</p>
    ${r.flags.length ? `<h4>⚠️ Alertas</h4><ul style="margin-left:18px;font-size:13px;color:#991b1b">${r.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <h4>Sección 1: Personalidad</h4>${pers}
    <h4>Sección 2: Memoria</h4>${mem}
    <h4>Sección 3: Cálculo</h4>${cal}
    <h4>Sección 4: Preguntas abiertas</h4>${ab}
  </div>`;
}

function exportCSV(){
  const lista = JSON.parse(localStorage.getItem('postulantes_jm')||'[]');
  if(!lista.length){ alert('Sin registros.'); return; }
  const head = ['Fecha','Nombre','DNI','Edad','Correo','Telefono','Grado','Distrito','Modalidad','Permanencia','Turno','Disponibilidad','Sueldo','PjePersonalidad','PjeMemoria','PjeCalculo','TiempoSeg','CambiosPestana','Pegados','Flags'];
  const rows = lista.map(r=>[
    new Date(r.fecha).toLocaleString(), r.nombre, r.dni, r.edad, r.correo, r.telefono, r.grado, r.distrito,
    r.modalidad, r.permanencia, r.turno, r.disponibilidad, r.sueldo,
    r.puntajes.personalidad, r.puntajes.memoria, r.puntajes.calculo,
    r.flagCount.tiempoTotal, r.flagCount.tab, r.flagCount.paste, r.flags.join(' | ')
  ]);
  const csv = [head, ...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'postulantes_'+Date.now()+'.csv'; a.click();
}

function borrarTodo(){
  if(confirm('¿Borrar todos los registros locales? Esta acción no se puede deshacer.')){
    localStorage.removeItem('postulantes_jm'); vAdmin();
  }
}

/* INIT */
vRegistro();
</script>
</body>
